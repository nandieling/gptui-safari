name: SafariPTTheme

options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  SafariPTTheme:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.areyouok.gptui.safari
        PRODUCT_NAME: gpt-ui
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SafariPTTheme.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: "-framework SafariServices -framework WebKit"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    dependencies:
      - target: SafariPTThemeExtension
        embed: true

  SafariPTThemeExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: Extension
        excludes:
          - Info.plist
      - path: ../theme.css
      - path: ../agsv-theme.css
      - path: ../safari-compat.css
      - path: ../site-colors.css
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: tech.areyouok.gptui.safari.extension
        PRODUCT_NAME: gpt-ui Extension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: SafariPTThemeExtension.entitlements
        ENABLE_APP_SANDBOX: YES
        ENABLE_USER_SELECTED_FILES: readonly
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_FILE: Extension/Info.plist
        OTHER_LDFLAGS: "-framework SafariServices"
        SKIP_INSTALL: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
